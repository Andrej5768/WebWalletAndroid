# Built upon the default detekt config (buildUponDefaultConfig = true); only the deviations are listed.
build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true
  excludes: ''

style:
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreNumbers: ['-1', '0', '1', '2', '100']
    ignoreFunction: ['dp', 'sp', 'Color', 'size', 'padding', 'height', 'width', 'weight', 'alpha']
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
  ReturnCount:
    max: 3
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Resolve the problem instead of leaving a marker.'
        value: 'FIXME:'
      - reason: 'Resolve the problem instead of leaving a marker.'
        value: 'STOPSHIP:'
  WildcardImport:
    active: true
    excludeImports: []

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated: ['Composable', 'Inject']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable', 'Preview', 'PreviewLightDark']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInObjects: 60
    ignorePrivate: true

formatting:
  active: true
  android: true
  autoCorrect: true
  MaximumLineLength:
    maxLineLength: 120
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
  FunctionNaming:
    ignoreAnnotated: ['Composable']

Compose:
  ModifierMissing:
    active: true
  PreviewPublic:
    active: true
  ContentEmitterReturningValues:
    active: true
  MultipleEmitters:
    active: true
  ViewModelForwarding:
    active: true
  UnstableCollections:
    active: true
