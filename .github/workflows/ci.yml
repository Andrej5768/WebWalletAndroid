name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # app/google-services.json is not committed; CI writes it from this secret (empty on fork PRs)
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
  # Every compiler warning is an error in CI; Compose compiler reports are written for the artifacts
  GRADLE_ARGS: -PwarningsAsErrors=true -PcomposeReports=true --no-daemon --stacktrace

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Firebase config from the repository secret
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}
      - name: detekt
        run: ./gradlew detekt $GRADLE_ARGS
      - name: Android Lint
        run: ./gradlew lintDevDebug $GRADLE_ARGS
      - name: Unit tests
        run: ./gradlew testDevDebugUnitTest test $GRADLE_ARGS
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/compose-reports/
          if-no-files-found: ignore

  assemble:
    name: Assemble devDebug APK and prodRelease AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Firebase config from the repository secret
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Assemble
        run: ./gradlew assembleDevDebug bundleProdRelease $GRADLE_ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: devDebug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prodRelease-aab
          path: app/build/outputs/bundle/prodRelease/*.aab

  api-drift:
    name: API contract matches the backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informational on branches and PRs, blocking on main (docs/02 §4.4)
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare openapi/openapi.json with the backend
        run: |
          curl -sSfL -o backend-openapi.json https://raw.githubusercontent.com/Andrej5768/WebWallet/master/api/openapi.json
          if ! diff -q backend-openapi.json openapi/openapi.json > /dev/null; then
            echo "::warning::openapi/openapi.json differs from the backend master; copy api/openapi.json and regenerate"
            diff backend-openapi.json openapi/openapi.json || true
            exit 1
          fi
          echo "In sync with the backend."
